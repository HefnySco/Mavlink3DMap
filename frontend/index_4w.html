<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mavlink 3D Map</title>
    <style>
        body { margin: 0; }
        canvas { display: block; }
    </style>
    <link rel="stylesheet" href="./src/css/styles.css">
</head>
<body>
    <div id='mav3dmap'>
        <div class="row"></div>
    </div>

    <!-- Pre-React loading splash: visible at t=0 before the JS module chain
         finishes. Removed by js_statusOverlay.fn_mount() once JS runs. -->
    <div id="mav3d_pre_splash" class="mav3d_status_overlay mav3d_status_loading">
        <span class="mav3d_status_dot"></span>
        <span class="mav3d_status_text">Mavlink3D loading...</span>
    </div>

    <script>
        window.sceneType = 'greengrass';
    </script>
    <script type="module" src="/src/index_4w.js"></script>
</body>
</html>
